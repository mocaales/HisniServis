services:
  mongodb:
    image: mongo:8
    container_name: hisniservis-mongodb
    restart: unless-stopped
    # Replica set z enim vozliščem: izbira ponudbe uporablja transakcije,
    # ki na samostojni instanci MongoDB niso podprte.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Ob prvem zagonu inicializira replica set, nato le preverja stanje.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 10

volumes:
  mongodb_data:
